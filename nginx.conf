server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The page loads fonts (Google Fonts) and scripts (React, Mermaid) from CDNs.
    # If you add a Content-Security-Policy, allow fonts.googleapis.com, fonts.gstatic.com,
    # cdnjs.cloudflare.com and cdn.jsdelivr.net, plus 'unsafe-inline' for scripts and styles.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
